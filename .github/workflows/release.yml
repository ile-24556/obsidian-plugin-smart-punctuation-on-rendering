name: Release Obsidian plugin

on:
  push:
    tags:
      - "*"
  workflow_dispatch:
permissions:
  attestations: write
  contents: write
  id-token: write
defaults:
  run:
    shell: bash --noprofile --norc -euxo pipefail {0}
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate version numbers
        run: |
          readonly tag="${GITHUB_REF#refs/tags/}"
          python3 scripts/validate_version_tag.py "$tag"

      - name: Restore npm cache if possible
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('package-lock.json') }}

      - uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4

      - name: Build plugin
        run: |
          npm ci
          npm run build
      - name: Generate artifact attestation
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: "main.js"

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          readonly tag="${GITHUB_REF#refs/tags/}"
          gh release create "$tag" --title="$tag" \
            --draft --fail-on-no-commits --generate-notes --prerelease \
            -- main.js manifest.json
