name: Release Obsidian plugin

on:
  push:
    tags:
      - "*"
  workflow_dispatch:
permissions:
  attestations: write
  contents: write
  id-token: write
defaults:
  run:
    shell: bash --noprofile --norc -euxo pipefail {0}
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Validate version numbers
        run: |
          readonly tag="${GITHUB_REF#refs/tags/}"
          python3 scripts/validate_version_tag.py "$tag"

      - name: Restore npm cache if possible
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('package-lock.json') }}

      - uses: jdx/mise-action@1648a7812b9aeae629881980618f079932869151 # v4.0.1

      - name: Build plugin
        run: |
          npm ci
          npm run build
      - name: Generate artifact attestation
        uses: actions/attest@59d89421af93a897026c735860bf21b6eb4f7b26 # v4.1.0
        with:
          subject-path: "main.js"

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          readonly tag="${GITHUB_REF#refs/tags/}"
          gh release create "$tag" --title="$tag" \
            --draft --fail-on-no-commits --generate-notes --prerelease \
            -- main.js manifest.json
